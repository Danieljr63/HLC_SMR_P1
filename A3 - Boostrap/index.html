<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3</title>
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav>
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </nav>
    <header>
        <h1>CSS con Bootstrap</h1>
    </header>
    <h2>Tarjetas</h2>
    <div class="card-group">
        <div class="card">
          <img src="https://www.ifam.es/wp-content/uploads/2015/08/imagenes-de-paisajes-hermosos-4.jpg" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Paisaje 1</h5>
            <p class="card-text">Descripcion del paisaje</p>
            <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
          </div>
        </div>
        <div class="card">
          <img src="https://st5.depositphotos.com/64145070/64693/i/450/depositphotos_646930840-stock-photo-sunset-ocean-beach-beautiful-seascape.jpg" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Paisaje 2</h5>
            <p class="card-text">Descripcion del paisaje</p>
            <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
          </div>
        </div>
        <div class="card">
          <img src="https://www.blogdelfotografo.com/wp-content/uploads/2020/04/fotografo-paisajes.jpg" class="card-img-top" alt="...">
          <div class="card-body">
            <h5 class="card-title">Paisaje 3</h5>
            <p class="card-text">Descripcion del paisaje</p>
            <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
          </div>
        </div>
      </div>
    <!--Formularios-->
    <h2>Formulario de Contacto</h2>
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Nombre</label><br>
        <input type="nombre" class="form-control" id="exampleFormControlInput1" required>
    </div>
    <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label">Email</label><br>
        <input type="email" class="form-control" id="exampleFormControlInput1" required>
    </div>
    <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label">Mensaje</label>
        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Enviar</button>
    </div>
    <footer>IES Ramón del Valle-Inclán</footer>
</body>
</html>
