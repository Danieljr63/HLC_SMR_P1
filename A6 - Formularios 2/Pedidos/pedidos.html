<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
</head>
<body>
    <script>
        function mostrarDatos(event) {
            event.preventDefault();
            const form = document.getElementById('pedidoForm');
            const nombre = form.nombre.value;
            const plato = form.plato.value;
            const cantidad = form.cantidad.value;
            const observaciones = form.observaciones.value;

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `
                <h3>Datos del Pedido:</h3>
                <p><strong>Nombre:</strong> ${nombre}</p>
                <p><strong>Plato:</strong> ${plato}</p>
                <p><strong>Cantidad:</strong> ${cantidad}</p>
                <p><strong>Observaciones:</strong> ${observaciones}</p>
            `;
        }
    </script>

    <h1>Realizar un Pedido</h1>
    <form id="pedidoForm" onsubmit="mostrarDatos(event)">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" minlength="3" maxlength="50" required autocomplete="name"><br><br>
        
        <label for="plato">Plato:</label>
        <input list="platos" id="plato" name="plato">
        <datalist id="platos">
            <option value="Spaghetti Carbonara">
            <option value="Pizza Margherita">
            <option value="Ensalada Caprese">
        </datalist><br><br>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" required><br><br>
        
        <label for="observaciones">Observaciones:</label><br>
        <textarea id="observaciones" name="observaciones"></textarea><br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Resetear</button>
    </form>
    <div id="resultado"></div>
    <p><a href="../index.html">Volver</a></p>
</body>
</html>
